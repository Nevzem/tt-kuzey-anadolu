function weekInfo(){const n=new Date(today+'T12:00:00'),m=new Date(n);m.setDate(n.getDate()-((n.getDay()+6)%7));let completed=0;for(const [offset,k] of [[0,'a'],[2,'b'],[4,'c']]){const d=new Date(m);d.setDate(m.getDate()+offset);const ds=dateStr(d);if(EX[k].length&&exerciseCount(ds,k)===EX[k].length)completed++}return {completed,pct:Math.round(completed/3*100)}}

return title+(programTab==='weekly'?weekly:detail)}function progress(){let records=[...state.measurements].sort((a,b)=>a.date.localeCompare(b.date));let field=chartMetric;let arr=records.filter(x=>x[field]!==''&&Number.isFinite(+x[field])).map(x=>({x:x.date,y:+x[field]}));let svg='';if(arr.length>=2){let vals=arr.map(x=>x.y),min=Math.min(...vals),max=Math.max(...vals),delta=Math.max(2,max-min),low=min-delta*.25,high=max+delta*.25;let pts=arr.map((v,i)=>`${24+(i/(arr.length-1))*292},${140-(v.y-low)/(high-low)*113}`).join(' ');svg='<svg class="graph" viewBox="0 0 340 165" aria-label="Ölçüm gelişim grafiği"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b77bff" stop-opacity=".32"/><stop offset="1" stop-color="#b77bff" stop-opacity="0"/></linearGradient></defs><path d="M24 140H316 M24 83H316 M24 26H316" stroke="#343747" stroke-width="1"/><polygon points="24,146 '+pts+' 316,146" fill="url(#fill)"/><polyline points="'+pts+'" fill="none" stroke="#bd7aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+arr.map((v,i)=>{let x=24+(i/(arr.length-1))*292,y=140-(v.y-low)/(high-low)*113;return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="#d9b9ff"/>'}).join('')+'</svg>'}else svg='<div class="empty" style="margin-top:12px">Grafiği oluşturmak için en az iki farklı tarihte ölçüm kaydet.</div>';let weight=latestMeasure('weight')??'—';let waist=latestMeasure('waist')??'—';let arm=latestMeasure('arm')??'—';let chest=latestMeasure('chest')??'—';return '<h1 class="headline">Gelişimim</h1><div class="toggle"><button class="'+(progressTab==='overview'?'selected':'')+'" data-progview="overview">Genel Bakış</button><button class="'+(progressTab==='measurements'?'selected':'')+'" data-progview="measurements">Ölçümler</button><button class="'+(progressTab==='performance'?'selected':'')+'" data-progview="performance">Performans</button></div><div class="card"><div class="row space"><strong>Vücut Ağırlığı</strong><span class="value">'+weight+' kg</s function showEx(id){let k=id.slice(0,1),i=+id.slice(1);if(!EX[k]||!EX[k][i])return;activeEx={k,i};let ex=EX[k][i],setlist=getSets(logDate,k,i);let rows=setlist.map((s,n)=>'<div class="setRow"><div class="setNo">'+(n+1)+'. set</div><label>Ağırlık (kg)<input type="number" min="0" max="500" step="0.5" inputmode="decimal" data-kg="'+n+'" value="'+esc(s.kg)+'" placeholder="kg"></label><label>Tekrar / sn<input type="number" min="0" max="300" inputmode="numeric" data-reps="'+n+'" value="'+esc(s.reps)+'"></label><button class="checkSet '+(s.done?'yes':'')+'" data-done="'+n+'">'+(s.done?'✓':'○')+'</button></div>').join('');document.getElementById('modal').innerHTML='<div class="sheetOverlay"><div class="sheet"><div class="handle"></div><button class="close" data-close="1">✕</button><div class="eyebrow">'+TYPE[k]+' • HAREKET '+(i+1)+'</div><img src="'+img(k,i)+'" alt="'+esc(ex[0])+' hareketinin iki pozisyonu"><h2>'+esc(ex[0])+'</h2><div class="row space"><span class="pill">'+esc(ex[1])+'</span><strong class="value">'+ex[2]+'</strong></div><p class="cue">'+esc(ex[3])+'</p><ol class="steps">'+ex[4].map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol><div class="section"><h3>Setlerini kaydet</h3><span class="tiny">'+fmtDate(logDate)+'</span></div><div class="formRows" id="sets">'+rows+'</div><button class="ghost full" data-addset="1">+ Bir set daha ekle</button><button class="primary full" data-savesets="1">✓ Setleri Kaydet</button><p class="footnote">İşaretli setler tamamlandı sayılır. Ağırlık ve tekrar değerlerini istediğin zaman güncelleyebilirsin.</p></div></div>'}
