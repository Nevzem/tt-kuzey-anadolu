const DAYS=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];const DAYSLONG=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];const PROGRAM={1:'a',3:'b',5:'c'};const TYPE={a:'Full Body A',b:'Full Body B',c:'Full Body C'};const INFO={a:'Göğüs • Sırt • Bacak',b:'Sırt • Omuz • Bacak',c:'Tüm vücut • Kol'};const NAV=[['home','Ana Sayfa','<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>'],['program','Program','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>'],['progress','Gelişim','<path d="M3 20V10m6 10V4m6 16v-7m6 7V7"/>'],['profile','Profil','<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>']];

function dayKey(d){const n=d.getDay();return PROGRAM[n]||null}const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long'});function weekNum(){let n=Math.floor((new Date(today+'T12:00')-new Date(state.startDate+'T12:00'))/604800000)+1;return Math.max(1,n)}function workoutCount(){return Object.keys(state.logs).filter(x=>Object.values(state.logs[x]).some(v=>v.some(s=>s.done))).length}function totalSets(){return Object.values(state.logs).reduce((s,d)=>s+Object.values(d).reduce((t,a)=>t+a.filter(x=>x.done).length,0),0)}function exerciseCount(d,k){return EX[k].filter((x,i)=>state.logs[d]?.[k+i]?.some(s=>s.done)).length}function todayKey(){return dayKey(new Date())}function getSets(d,k,i){let id=k+i;const prev=state.logs[d]?.[id];if(prev)return prev.map(x=>({...x}));let n=(weekNum()>=3 && i<4)?3:2;return Array.from({length:n},()=>({kg:'',reps:EX[k][i][5],done:false}))}function img(k,i){return 'assets/'+k+(i+1)+'.webp'}function nav(to){screen=to;activeEx=null;render();window.scrollTo({top:0,behavior:'smooth'})}function icon(code){return '<svg viewBox="0 0 24 24">'+code+'</svg>'}function footer(){return '<nav class="tabbar">'+NAV.map(([id,label,path])=>'<button class="tab '+(screen===id?'active':'')+'" data-nav="'+id+'">'+icon(path)+'<span>'+label+'</span></button>').join('')+'</nav>'}function topbar(){return '<div class="top"><div class="logo"><i>ϟ</i> FORMA<span style="color:#a479df">.</span></div><div class="row"><span class="topnote">KİŞİSEL ANTRENMAN</span><span class="circle">YD</span></div></div>'}function daysWidget(){let now=new Date();let monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));return '<div class="weekdays">'+Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);let str=dateStr(d);let k=dayKey(d);let done=k?exerciseCount(str,k)>0:false;return '<button class="day '+(str===today?'current ':'')+(done?'done':'')+'" data-day="'+(k||'')+'"><small>'+DAYS[d.getDay()]+'</small><strong>'+d.getDate()+'</strong><span class="dot"></span></button>'}).join('')+'</div>'}function dailyItems(){return [[1,'Pazartesi',TYPE.a,INFO.a,'a'],[2,'Salı','Aktif toparlanma','30 dk yürüyüş ve esneme',''],[3,'Çarşamba',TYPE.b,INFO.b,'b'],[4,'Perşembe','Dinlenme','Hafif yoga veya esneme',''],[5,'Cuma',TYPE.c,INFO.c,'c'],[6,'Cumartesi','Hafif kardiyo','25–35 dk bisiklet veya yürüyüş',''],[0,'Pazar','Dinlenme','Serbest gün','']]}function progressPct(){let k=todayKey();return k?Math.round(exerciseCount(today,k)/EX[k].length*100):0}function latestMeasure(field){let a=[...state.measurements].filter(x=>Number.isFinite(+x[field])&&x[field]!=='' ).sort((x,y)=>x.date.localeCompare(y.date));return a.length?a.at(-1)[field]:null}
function home(){let k=todayKey();let p=progressPct();return '<div class="eyebrow">YENİ BAŞLANGIÇ • HAFTA '+weekNum()+'</div><h1 class="headline">Bugün de <span class="gradtext">bir adım ileri.</span> 💪</h1><p class="sub">Antrenmanını takip et, ağırlıklarını kaydet, gelişimini gör.</p><section class="hero"><div class="eyebrow" style="color:#e3bdff">BUGÜNÜN PLANI</div><h2>'+(k?TYPE[k]:'Aktif toparlanma')+'</h2><p>'+(k?INFO[k]+' • 50–65 dk':'Hafif hareket veya dinlenme • toparlanma')+'</p><button class="primary" data-nav="program">'+(k?'Antrenmana Başla':'Haftalık Planı Aç')+' &nbsp;➜</button></section><div class="section"><h3>Gelişim panelin</h3><span class="pill">Canlı veriler</span></div><div class="stats"><div class="metric"><span>Tamamlanan gün</span><b>'+workoutCount()+'</b><span>antrenman</span></div><div class="metric"><span>Kaydedilen set</span><b>'+totalSets()+'</b><span>tamamlandı</span></div><div class="metric"><span>Son kilo</span><b>'+(latestMeasure('weight')??'—')+'</b><span>kg • ölçüm</span></div></div><div class="section"><h3>Bu haftanın akışı</h3><span class="tiny">Bugün: '+fmtDate(today)+'</span></div>'+daysWidget()+'<div class="section"><h3>Bugünkü ilerlemen</h3><span class="value">%'+p+'</span></div><div class="barline"><i style="width:'+p+'%"></i></div><p class="footnote">'+(k?exerciseCount(today,k)+' / '+EX[k].length+' hareket için en az bir set işaretlendi.':'Bugün ağırlık günü değil; hafif hareket ve toparlanmaya odaklan.')+'</p><div class="notice">Başlangıçta ağırlıkları zorlamadan, hareket tekniğine odaklan. Bu uygulama tıbbi takip yerine geçmez.</div>'}
function program(){let week=weekNum();return '<div class="eyebrow">HAFTALIK PLAN • HAFTA '+week+'</div><h1 class="headline">Antrenman <span class="gradtext">programın.</span></h1><p class="sub">3 gün ağırlık + 2 gün hafif kardiyo. Hareket görsellerini açıp setlerini kaydet.</p><div class="toggle">'+['a','b','c'].map(x=>'<button class="'+(selectedDay===x?'selected':'')+'" data-selectday="'+x+'">'+({a:'Pazartesi',b:'Çarşamba',c:'Cuma'}[x])+'</button>').join('')+'</div><div class="card" style="border-color:#654284"><div class="row space"><div><div class="eyebrow">'+({a:'PAZARTESİ',b:'ÇARŞAMBA',c:'CUMA'}[selectedDay])+'</div><h2 style="margin:7px 0 4px">'+TYPE[selectedDay]+'</h2><div class="tiny">'+INFO[selectedDay]+'</div></div><div class="pill">'+EX[selectedDay].length+' hareket</div></div></div><div class="row space" style="margin-bottom:13px"><div class="tiny">5–10 dk ısınma • Set arası 60–120 sn</div><div class="pill">Hafta '+week+'</div></div><div class="field"><label>Kaydetmek istediğin tarih</label><input type="date" id="logDate" value="'+logDate+'" max="2099-12-31"></div><div class="exerciseList">'+EX[selectedDay].map((x,i)=>{let done=state.logs[logDate]?.[selectedDay+i]?.filter(x=>x.done).length||0;return '<div class="exCard" data-ex="'+selectedDay+i+'"><img src="'+img(selectedDay,i)+'" alt="'+esc(x[0])+' hareket başlangıç ve bitiş örneği" loading="lazy"><div class="rest"><strong>'+esc(x[0])+'</strong><p>'+esc(x[1])+'</p><span class="presc">'+x[2]+'</span> '+(done?'<span class="success" style="font-size:11px">✓ '+done+' set</span>':'')+'</div><span class="chev">›</span></div>'}).join('')+'</div><div class="section"><h3>Diğer günler</h3></div><div class="card">'+dailyItems().filter(x=>!x[4]).map(x=>'<div class="miniRow"><strong>'+x[1]+'</strong><span class="muted">'+x[2]+'</span></div>').join('')+'</div><p class="footnote">3. haftadan itibaren iyi toparlanıyorsan ilk dört hareket için 3 sete çıkabilirsin. Rahatsızlık veya aşırı yorgunluk varsa ilerlemeyi yavaşlat.</p>'}
function progress(){let records=[...state.measurements].sort((a,b)=>a.date.localeCompare(b.date));let field=chartMetric;let arr=records.filter(x=>x[field]!==''&&Number.isFinite(+x[field])).map(x=>({x:x.date,y:+x[field]}));let svg='';if(arr.length>=2){let vals=arr.map(x=>x.y),min=Math.min(...vals),max=Math.max(...vals),delta=Math.max(2,max-min),low=min-delta*.25,high=max+delta*.25;let pts=arr.map((v,i)=>`${24+(i/(arr.length-1))*292},${140-(v.y-low)/(high-low)*113}`).join(' ');svg='<svg class="graph" viewBox="0 0 340 165" aria-label="Ölçüm gelişim grafiği"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b77bff" stop-opacity=".32"/><stop offset="1" stop-color="#b77bff" stop-opacity="0"/></linearGradient></defs><path d="M24 140H316 M24 83H316 M24 26H316" stroke="#343747" stroke-width="1"/><polygon points="24,146 '+pts+' 316,146" fill="url(#fill)"/><polyline points="'+pts+'" fill="none" stroke="#bd7aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+arr.map((v,i)=>{let x=24+(i/(arr.length-1))*292,y=140-(v.y-low)/(high-low)*113;return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="#d9b9ff"/>'}).join('')+'</svg>'}else svg='<div class="empty" style="margin-top:12px">Grafiği oluşturmak için en az iki farklı tarihte ölçüm kaydet.</div>';let counts={};for(let day of Object.keys(state.logs)){let month=day.slice(0,7);counts[month]=(counts[month]||0)+Object.values(state.logs[day]).reduce((s,l)=>s+l.filter(x=>x.done).length,0)}return '<div class="eyebrow">ÖLÇ • GELİŞ • TAKİP ET</div><h1 class="headline">Gelişim <span class="gradtext">merkezin.</span></h1><p class="sub">Hiçbir veriyi tahmin etmiyoruz. Kaydettiğin ölçüler ve setler grafiğe dönüşür.</p><div class="stats"><div class="metric"><span>Antrenman</span><b>'+workoutCount()+'</b><span>gün</span></div><div class="metric"><span>Toplam set</span><b>'+totalSets()+'</b><span>kaydedildi</span></div><div class="metric"><span>Ölçüm</span><b>'+state.measurements.length+'</b><span>kayıt</span></div></div><div class="section"><h3>Vücut ölçülerin</h3><button class="ghost compact" data-measure="1">+ Ölçüm Ekle</button></div><div class="card"><div class="toggle">'+[['weight','Kilo'],['waist','Bel'],['chest','Göğüs'],['arm','Kol']].map(([id,label])=>'<button data-chart="'+id+'" class="'+(chartMetric===id?'selected':'')+'">'+label+'</button>').join('')+'</div><div class="row space"><strong>'+({weight:'Kilo (kg)',waist:'Bel (cm)',chest:'Göğüs (cm)',arm:'Kol (cm)'}[field])+'</strong><span class="value">'+(arr.length?arr.at(-1).y:'—')+'</span></div>'+svg+'</div><div class="section"><h3>Son ölçümler</h3></div>'+(records.length?'<div class="card">'+records.slice(-5).reverse().map(x=>'<div class="miniRow"><strong>'+fmtDate(x.date)+'</strong><span class="muted">'+(x.weight!==''?x.weight+' kg':'')+(x.waist!==''?' • Bel '+x.waist+' cm':'')+'</span></div>').join('')+'</div>':'<div class="empty">Henüz ölçüm yok. İlk kaydınla başla.</div>')+'<div class="section"><h3>Antrenman geçmişi</h3></div>'+(Object.keys(state.logs).length?'<div class="card">'+Object.keys(state.logs).sort().reverse().slice(0,12).map(d=>'<div class="miniRow"><strong>'+fmtDate(d)+'</strong><span class="muted">'+Object.values(state.logs[d]).reduce((s,a)=>s+a.filter(x=>x.done).length,0)+' tamamlanan set</span></div>').join('')+'</div>':'<div class="empty">İlk antrenmandaki setleri kaydettiğinde burada göreceksin.</div>')}
function profile(){return '<div class="eyebrow">KİŞİSEL ALANIN</div><h1 class="headline">Benim <span class="gradtext">ayarlarım.</span></h1><p class="sub">Verilerin bu cihazın tarayıcısında saklanır. Hesap veya bulut senkronizasyonu yoktur.</p><div class="card"><div class="field"><label>Boy (cm)</label><input type="number" inputmode="decimal" id="height" value="'+(state.height||191)+'"></div><div class="field"><label>Program başlangıç tarihi</label><input type="date" id="startDate" value="'+state.startDate+'"></div><div class="field"><label>Hedefin</label><input type="text" id="goal" value="'+esc(state.goal||'')+'"></div><button class="primary full" data-profile-save="1">Ayarları Kaydet</button></div><div class="section"><h3>Verilerini yönet</h3></div><div class="card"><p class="tiny" style="margin-top:0">Telefon değiştirirsen veya tarayıcı verilerini silersen kayıtların kaybolabilir. Düzenli yedek al.</p><div class="fields"><button class="ghost" data-backup="1">↓ JSON Yedekle</button><button class="ghost" data-csv="1">↓ CSV Dışa Aktar</button></div><div class="field" style="margin-top:14px"><label>Eski yedeği içe aktar</label><input type="file" id="importFile" accept="application/json,.json"></div></div><div class="section"><h3>Program hakkında</h3></div><div class="notice">Bu plan spora yeniden başlayan sağlıklı yetişkin için tasarlanmış genel bir başlangıç programıdır. RAD-140, MK-677, YK-11 veya benzeri deneysel maddelerin güvenli olduğu anlamına gelmez. Bunları kullanmayı planlıyorsan hekim değerlendirmesi al; özellikle uyarıcıları birleştirme.</div><div style="height:15px"></div><p class="footnote">FORMA • İlk çalışan taslak v1.0<br>Hareket görselleri yapay zekâ ile üretilmiş açıklayıcı örneklerdir; teknik doğruluk için eğitmen desteği al.</p>'}
function render(){document.getElementById('root').innerHTML=topbar()+(screen==='home'?home():screen==='program'?program():screen==='progress'?progress():profile())+footer()}
function showEx(id){let k=id.slice(0,1),i=+id.slice(1);if(!EX[k]||!EX[k][i])return;activeEx={k,i};let ex=EX[k][i],setlist=getSets(logDate,k,i);let rows=setlist.map((s,n)=>'<div class="setRow"><div class="setNo">'+(n+1)+'. set</div><label>Ağırlık (kg)<input type="number" min="0" max="500" step="0.5" inputmode="decimal" data-kg="'+n+'" value="'+esc(s.kg)+'" placeholder="kg"></label><label>Tekrar / sn<input type="number" min="0" max="300" inputmode="numeric" data-reps="'+n+'" value="'+esc(s.reps)+'"></label><button class="checkSet '+(s.done?'yes':'')+'" data-done="'+n+'">'+(s.done?'✓':'○')+'</button></div>').join('');document.getElementById('modal').innerHTML='<div class="sheetOverlay"><div class="sheet"><div class="handle"></div><button class="close" data-close="1">✕</button><div class="eyebrow">'+TYPE[k]+' • HAREKET '+(i+1)+'</div><img src="'+img(k,i)+'" alt="'+esc(ex[0])+' hareketinin iki pozisyonu"><h2>'+esc(ex[0])+'</h2><div class="row space"><span class="pill">'+esc(ex[1])+'</span><strong class="value">'+ex[2]+'</strong></div><p class="cue">'+esc(ex[3])+'</p><ol class="steps">'+ex[4].map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol><div class="section"><h3>Setlerini kaydet</h3><span class="tiny">'+fmtDate(logDate)+'</span></div><div class="formRows" id="sets">'+rows+'</div><button class="ghost full" data-addset="1">+ Bir set daha ekle</button><button class="primary full" data-savesets="1">✓ Setleri Kaydet</button><p class="footnote">İşaretli setler tamamlandı sayılır. Ağırlık ve tekrar değerlerini istediğin zaman güncelleyebilirsin.</p></div></div>'}
function closeModal(){document.getElementById('modal').innerHTML='';activeEx=null}
function saveSets(){if(!activeEx)return;let els=[...document.querySelectorAll('#sets .setRow')];let records=els.map(row=>{let kg=row.querySelector('[data-kg]').value,reps=row.querySelector('[data-reps]').value,done=row.querySelector('[data-done]').classList.contains('yes');return {kg:kg===''?'':+kg,reps:reps===''?'':+reps,done}});if(records.some(s=>s.kg!==''&&(s.kg<0||s.kg>500)||s.reps!==''&&(s.reps<0||s.reps>300))){toast('Ağırlık veya tekrar değerini kontrol et.');return}state.logs[logDate]??={};state.logs[logDate][activeEx.k+activeEx.i]=records;save();closeModal();render();toast('Setlerin kaydedildi ✓')}
function showMeasure(){document.getElementById('modal').innerHTML='<div class="sheetOverlay"><div class="sheet"><div class="handle"></div><button class="close" data-close="1">✕</button><h2>Yeni ölçüm</h2><p class="tiny">Ölçüm yaptığın günün değerlerini gir. Bilmediğin alanlar boş kalabilir.</p><div class="field"><label>Tarih</label><input id="measureDate" type="date" value="'+today+'"></div><div class="fields">'+[['weight','Kilo (kg)'],['waist','Bel (cm)'],['chest','Göğüs (cm)'],['arm','Kol (cm)']].map(([id,label])=>'<div class="field"><label>'+label+'</label><input id="m-'+id+'" type="number" inputmode="decimal" step="0.1" placeholder="—"></div>').join('')+'</div><button class="primary full" data-save-measure="1">Ölçümü Kaydet</button></div></div>'}
function toast(msg){let n=document.createElement('div');n.textContent=msg;n.style.cssText='position:fixed;z-index:60;bottom:92px;left:50%;transform:translateX(-50%);border:1px solid #7157a4;background:#241e34;color:white;border-radius:12px;padding:13px 18px;max-width:85%;font-size:13px;box-shadow:0 12px 35px #0008';document.body.append(n);setTimeout(()=>n.remove(),2500)}
function downloadFile(content,name,type){let b=new Blob([content],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){downloadFile(JSON.stringify(state,null,2),'forma-yedek-'+today+'.json','application/json');toast('JSON yedeğin indirildi')}
function csv(){let rows=[['Tarih','Hareket','Set','Agirlik (kg)','Tekrar','Tamamlandi']];for(let d of Object.keys(state.logs).sort())for(let id of Object.keys(state.logs[d])){let ex=EX[id[0]]?.[+id.slice(1)];if(!ex)continue;state.logs[d][id].forEach((s,i)=>rows.push([d,ex[0],i+1,s.kg,s.reps,s.done?'Evet':'Hayir']))}const line=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile('\ufeff'+line,'forma-antrenman-'+today+'.csv','text/csv;charset=utf-8');toast('CSV dosyası indirildi')}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-nav],[data-day],[data-selectday],[data-ex],[data-close],[data-done],[data-addset],[data-savesets],[data-measure],[data-save-measure],[data-chart],[data-profile-save],[data-backup],[data-csv]');if(!btn){if(e.target.classList.contains('sheetOverlay'))closeModal();return}let d=btn.dataset;if(d.nav){nav(d.nav);return}if('day'in d){if(d.day){selectedDay=d.day;nav('program')}else {nav('program')}return}if(d.selectday){selectedDay=d.selectday;render();return}if(d.ex){showEx(d.ex);return}if(d.close){closeModal();return}if(d.done!==undefined){btn.classList.toggle('yes');btn.textContent=btn.classList.contains('yes')?'✓':'○';return}if(d.addset){const num=document.querySelectorAll('#sets .setRow').length;const wrap=document.createElement('div');wrap.className='setRow';wrap.innerHTML='<div class="setNo">'+(num+1)+'. set</div><label>Ağırlık (kg)<input data-kg="'+num+'" type="number" min="0" max="500" step="0.5" inputmode="decimal" placeholder="kg"></label><label>Tekrar / sn<input type="number" min="0" max="300" inputmode="numeric" data-reps="'+num+'" value="12"></label><button class="checkSet" data-done="'+num+'">○</button>';document.querySelector('#sets').append(wrap);return}if(d.savesets){saveSets();return}if(d.measure){showMeasure();return}if(d.saveMeasure){let date=document.getElementById('measureDate').value;let fields=['weight','waist','chest','arm'];let m={date};fields.forEach(f=>{let x=document.getElementById('m-'+f).value;m[f]=x===''?'':+x});if(!date||fields.every(f=>m[f]==='')){toast('Tarih ve en az bir ölçüm gir.');return}if(fields.some(f=>m[f]!==''&&(m[f]<=0||m[f]>500))){toast('Ölçüm değerlerini kontrol et.');return}state.measurements=state.measurements.filter(x=>x.date!==date).concat(m);save();closeModal();render();toast('Ölçüm kaydedildi ✓');return}if(d.chart){chartMetric=d.chart;render();return}if(d.profileSave){let h=+document.getElementById('height').value,start=document.getElementById('startDate').value,g=document.getElementById('goal').value;if(!h||h<100||h>250||!start){toast('Boy ve tarih değerini kontrol et.');return}state.height=h;state.startDate=start;state.goal=g;save();render();toast('Ayarlar kaydedildi');return}if(d.backup){backup();return}if(d.csv){csv();return}});document.addEventListener('change',e=>{if(e.target.id==='logDate'){logDate=e.target.value||today;render()}if(e.target.id==='importFile'){const f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(typeof j.logs!=='object'||!Array.isArray(j.measurements)||!j.startDate)throw Error('format');if(!confirm('Mevcut kayıtların bu yedekle değiştirilecek. Devam edilsin mi?'))return;state=j;save();render();toast('Yedek içe aktarıldı ✓')}catch(e){toast('Geçerli bir FORMA JSON yedeği seç.')}};r.readAsText(f)}});render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
