let detail='<div class="toggle" style="margin-top:7px">'+[['a','Pzt'],['b','Çar'],['c','Cum']].map(([k,day])=>'<button class="'+(selectedDay===k?'selected':'')+'" data-selectday="'+k+'">'+day+'</button>').join('')+'</div><div class="card"><div class="eyebrow">'+({a:'PAZARTESİ',b:'ÇARŞAMBA',c:'CUMA'}[selectedDay])+'</div><h2 style="margin:7px 0 4px">'+TYPE[selectedDay]+'</h2><div class="tiny">'+INFO[selectedDay]+' • 5–10 dk ısınma</div></div><div class="field"><label>Antrenman tarihi</label><input type="date" id="logDate" value="'+logDate+'"></div>'+EX[selectedDay].map((x,i)=>{let done=state.logs[logDate]?.[selectedDay+i]?.filter(s=>s.done).length||0;return '<button type="button" class="listCard" style="width:100%;text-align:left" data-ex="'+selectedDay+i+'"><img src="'+img(selectedDay,i)+'" alt="'+esc(x[0])+'" style="width:100px"><div class="rest"><strong>'+esc(x[0])+'</strong><small>'+esc(x[1])+' • '+x[2]+'</small><small style="color:'+(done?'#79e7a7':'#b99be3')+'">'+(done?'✓ '+done+' set kaydedildi':'Hareketi ve setleri aç')+'</small></div><span class="checkBadge">›</span></button>'}).join('')+'<p class="footnote">1–2. hafta 2 set, 3–4. hafta toparlanmana göre ana hareketlerde 3 set. Zorlamadan başla.</p>';
return title+(programTab==='weekly'?weekly:detail)}function progress(){let records=[...state.measurements].sort((a,b)=>a.date.localeCompare(b.date));let field=chartMetric;let arr=records.filter(x=>x[field]!==''&&Number.isFinite(+x[field])).map(x=>({x:x.date,y:+x[field]}));let svg='';if(arr.length>=2){let vals=arr.map(x=>x.y),min=Math.min(...vals),max=Math.max(...vals),delta=Math.max(2,max-min),low=min-delta*.25,high=max+delta*.25;let pts=arr.map((v,i)=>`${24+(i/(arr.length-1))*292},${140-(v.y-low)/(high-low)*113}`).join(' ');svg='<svg class="graph" viewBox="0 0 340 165" aria-label="Ölçüm gelişim grafiği"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b77bff" stop-opacity=".32"/><stop offset="1" stop-color="#b77bff" stop-opacity="0"/></linearGradient></defs><path d="M24 140H316 M24 83H316 M24 26H316" stroke="#343747" stroke-width="1"/><polygon points="24,146 '+pts+' 316,146" fill="url(#fill)"/><polyline points="'+pts+'" fill="none" stroke="#bd7aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+arr.map((v,i)=>{let x=24+(i/(arr.length-1))*292,y=140-(v.y-low)/(high-low)*113;return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="#d9b9ff"/>'}).join('')+'</svg>'}else svg='<div class="empty" style="margin-top:12px">Grafiği oluşturmak için en az iki farklı tarihte ölçüm kaydet.</div>';let weight=latestMeasure('weight')??'—';let waist=latestMeasure('waist')??'—';let arm=latestMeasure('arm')??'—';let chest=latestMeasure('chest')??'—';return '<h1 class="headline">Gelişimim</h1><div class="toggle"><button class="'+(progressTab==='overview'?'selected':'')+'" data-progview="overview">Genel Bakış</button><button class="'+(progressTab==='measurements'?'selected':'')+'" data-progview="measurements">Ölçümler</button><button class="'+(progressTab==='performance'?'selected':'')+'" data-progview="performance">Performans</button></div><div class="card"><div class="row space"><strong>Vücut Ağırlığı</strong><span class="value">'+weight+' kg</span></div>'+svg+'</div><div class="miniStats"><div class="miniStat"><span>Bel</span><strong>'+waist+(waist!=='—'?' cm':'')+'</strong></div><div class="miniStat"><span>Kol</span><strong>'+arm+(arm!=='—'?' cm':'')+'</strong></div><div class="miniStat"><span>Göğüs</span><strong>'+chest+(chest!=='—'?' cm':'')+'</strong></div><div class="miniStat"><span>Antrenman</span><strong>'+workoutCount()+'</strong></div></div><div class="section"><h3>Haftalık Tamamlama</h3><button class="ghost compact" data-measure="1">+ Ölçüm Ekle</button></div><div class="card"><div class="progressGlass" style="margin-top:0"><div class="ring" style="--p:'+Math.min(100,Math.round(weekInfo().pct)||0)+'%"><span>%'+Math.min(100,Math.round(weekInfo().pct)||0)+'</span></div><div class="progressText"><strong>'+weekInfo().completed+' / 3 antrenman</strong><small>Pzt • Çar • Cum</small><div class="progressBar"><i style="width:'+Math.min(100,Math.round(weekInfo().pct)||0)+'%"></i></div></div></div></div>'}function profile(){return '<h1 class="headline">Beslenme & Notlar</h1><p class="sub">Bu alanı günlük hedeflerin ve kişisel notların için kullan.</p><div class="card"><div class="field"><label>Hedefin</label><input type="text" id="goal" value="'+esc(state.goal||'')+'"></div><div class="field"><label>Boy (cm)</label><input type="number" inputmode="decimal" id="height" value="'+(state.height||191)+'"></div><div class="field"><label>Program başlangıç tarihi</label><input type="date" id="startDate" value="'+state.startDate+'"></div><button class="primary full" data-profile-save="1">Kaydet</button></div><div class="card"><div class="section" style="margin-top:0"><h3>Verilerini yönet</h3></div><div class="fields"><button class="ghost" data-backup="1">JSON Yedekle</button><button class="ghost" data-csv="1">CSV Dışa Aktar</button></div><div class="field" style="margin-top:14px"><label>Yedek içe aktar</label><input type="file" id="importFile" accept="application/json,.json"></div></div><div class="notice">Not: Bu sürüm, paylaştığın premium mockup görünümüne yakın olacak şekilde yeniden tasarlanıyor. Veri kayıt mantığı korunuyor.</div>'}function render(){document.getElementById('root').innerHTML=topbar()+(screen==='home'?home():screen==='program'?program():screen==='progress'?progress():profile())+footer()}
function showEx(id){let k=id.slice(0,1),i=+id.slice(1);if(!EX[k]||!EX[k][i])return;activeEx={k,i};let ex=EX[k][i],setlist=getSets(logDate,k,i);let rows=setlist.map((s,n)=>'<div class="setRow"><div class="setNo">'+(n+1)+'. set</div><label>Ağırlık (kg)<input type="number" min="0" max="500" step="0.5" inputmode="decimal" data-kg="'+n+'" value="'+esc(s.kg)+'" placeholder="kg"></label><label>Tekrar / sn<input type="number" min="0" max="300" inputmode="numeric" data-reps="'+n+'" value="'+esc(s.reps)+'"></label><button class="checkSet '+(s.done?'yes':'')+'" data-done="'+n+'">'+(s.done?'✓':'○')+'</button></div>').join('');document.getElementById('modal').innerHTML='<div class="sheetOverlay"><div class="sheet"><div class="handle"></div><button class="close" data-close="1">✕</button><div class="eyebrow">'+TYPE[k]+' • HAREKET '+(i+1)+'</div><img src="'+img(k,i)+'" alt="'+esc(ex[0])+' hareketinin iki pozisyonu"><h2>'+esc(ex[0])+'</h2><div class="row space"><span class="pill">'+esc(ex[1])+'</span><strong class="value">'+ex[2]+'</strong></div><p class="cue">'+esc(ex[3])+'</p><ol class="steps">'+ex[4].map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol><div class="section"><h3>Setlerini kaydet</h3><span class="tiny">'+fmtDate(logDate)+'</span></div><div class="formRows" id="sets">'+rows+'</div><button class="ghost full" data-addset="1">+ Bir set daha ekle</button><button class="primary full" data-savesets="1">✓ Setleri Kaydet</button><p class="footnote">İşaretli setler tamamlandı sayılır. Ağırlık ve tekrar değerlerini istediğin zaman güncelleyebilirsin.</p></div></div>'}
function closeModal(){document.getElementById('modal').innerHTML='';activeEx=null}
function saveSets(){if(!activeEx)return;let els=[...document.querySelectorAll('#sets .setRow')];let records=els.map(row=>{let kg=row.querySelector('[data-kg]').value,reps=row.querySelector('[data-reps]').value,done=row.querySelector('[data-done]').classList.contains('yes');return {kg:kg===''?'':+kg,reps:reps===''?'':+reps,done}});if(records.some(s=>s.kg!==''&&(s.kg<0||s.kg>500)||s.reps!==''&&(s.reps<0||s.reps>300))){toast('Ağırlık veya tekrar değerini kontrol et.');return}state.logs[logDate]??={};state.logs[logDate][activeEx.k+activeEx.i]=records;save();closeModal();render();toast('Setlerin kaydedildi ✓')}
function showMeasure(){document.getElementById('modal').innerHTML='<div class="sheetOverlay"><div class="sheet"><div class="handle"></div><button class="close" data-close="1">✕</button><h2>Yeni ölçüm</h2><p class="tiny">Ölçüm yaptığın günün değerlerini gir. Bilmediğin alanlar boş kalabilir.</p><div class="field"><label>Tarih</label><input id="measureDate" type="date" value="'+today+'"></div><div class="fields">'+[['weight','Kilo (kg)'],['waist','Bel (cm)'],['chest','Göğüs (cm)'],['arm','Kol (cm)']].map(([id,label])=>'<div class="field"><label>'+label+'</label><input id="m-'+id+'" type="number" inputmode="decimal" step="0.1" placeholder="—"></div>').join('')+'</div><button class="primary full" data-save-measure="1">Ölçümü Kaydet</button></div></div>'}
function toast(msg){let n=document.createElement('div');n.textContent=msg;n.style.cssText='position:fixed;z-index:60;bottom:92px;left:50%;transform:translateX(-50%);border:1px solid #7157a4;background:#241e34;color:white;border-radius:12px;padding:13px 18px;max-width:85%;font-size:13px;box-shadow:0 12px 35px #0008';document.body.append(n);setTimeout(()=>n.remove(),2500)}
function downloadFile(content,name,type){let b=new Blob([content],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){downloadFile(JSON.stringify(state,null,2),'forma-yedek-'+today+'.json','application/json');toast('JSON yedeğin indirildi')}
function csv(){let rows=[['Tarih','Hareket','Set','Agirlik (kg)','Tekrar','Tamamlandi']];for(let d of Object.keys(state.logs).sort())for(let id of Object.keys(state.logs[d])){let ex=EX[id[0]]?.[+id.slice(1)];if(!ex)continue;state.logs[d][id].forEach((s,i)=>rows.push([d,ex[0],i+1,s.kg,s.reps,s.done?'Evet':'Hayir']))}const line=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile('\ufeff'+line,'forma-antrenman-'+today+'.csv','text/csv;charset=utf-8');toast('CSV dosyası indirildi')}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-nav],[data-day],[data-selectday],[data-progtab],[data-progview],[data-openday],[data-ex],[data-close],[data-done],[data-addset],[data-savesets],[data-measure],[data-save-measure],[data-chart],[data-profile-save],[data-backup],[data-csv]');if(!btn){if(e.target.classList.contains('sheetOverlay'))closeModal();return}let d=btn.dataset;if(d.nav){nav(d.nav);return}if('day'in d){if(d.day){selectedDay=d.day;nav('program')}else {nav('program')}return}if(d.selectday){selectedDay=d.selectday;programTab='detail';render();return}if(d.progtab){programTab=d.progtab;render();return}if(d.progview){progressTab=d.progview;render();return}if(d.openday){if(d.openday==='rest'){programTab='weekly';toast('Bugün aktif toparlanma veya dinlenme günü.');return}selectedDay=d.openday;programTab='detail';render();window.scrollTo({top:0,behavior:'smooth'});return}if(d.ex){showEx(d.ex);return}if(d.close){closeModal();return}if(d.done!==undefined){btn.classList.toggle('yes');btn.textContent=btn.classList.contains('yes')?'✓':'○';return}if(d.addset){const num=document.querySelectorAll('#sets .setRow').length;const wrap=document.createElement('div');wrap.className='setRow';wrap.innerHTML='<div class="setNo">'+(num+1)+'. set</div><label>Ağırlık (kg)<input data-kg="'+num+'" type="number" min="0" max="500" step="0.5" inputmode="decimal" placeholder="kg"></label><label>Tekrar / sn<input type="number" min="0" max="300" inputmode="numeric" data-reps="'+num+'" value="12"></label><button class="checkSet" data-done="'+num+'">○</button>';document.querySelector('#sets').append(wrap);return}if(d.savesets){saveSets();return}if(d.measure){showMeasure();return}if(d.saveMeasure){let date=document.getElementById('measureDate').value;let fields=['weight','waist','chest','arm'];let m={date};fields.forEach(f=>{let x=document.getElementById('m-'+f).value;m[f]=x===''?'':+x});if(!date||fields.every(f=>m[f]==='')){toast('Tarih ve en az bir ölçüm gir.');return}if(fields.some(f=>m[f]!==''&&(m[f]<=0||m[f]>500))){toast('Ölçüm değerlerini kontrol et.');return}state.measurements=state.measurements.filter(x=>x.date!==date).concat(m);save();closeModal();render();toast('Ölçüm kaydedildi ✓');return}if(d.chart){chartMetric=d.chart;render();return}if(d.profileSave){let h=+document.getElementById('height').value,start=document.getElementById('startDate').value,g=document.getElementById('goal').value;if(!h||h<100||h>250||!start){toast('Boy ve tarih değerini kontrol et.');return}state.height=h;state.startDate=start;state.goal=g;save();render();toast('Ayarlar kaydedildi');return}if(d.backup){backup();return}if(d.csv){csv();return}});document.addEventListener('change',e=>{if(e.target.id==='logDate'){logDate=e.target.value||today;render()}if(e.target.id==='importFile'){const f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(typeof j.logs!=='object'||!Array.isArray(j.measurements)||!j.startDate)throw Error('format');if(!confirm('Mevcut kayıtların bu yedekle değiştirilecek. Devam edilsin mi?'))return;state=j;save();render();toast('Yedek içe aktarıldı ✓')}catch(e){toast('Geçerli bir FORMA JSON yedeği seç.')}};r.readAsText(f)}});render();
</script></body></html>
